name: MANDATE — Governed Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  mandate-review:
    name: Run MANDATE Governed Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MANDATE governed review
        env:
          ARMORIQ_API_KEY: ${{ secrets.ARMORIQ_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Fetch the base branch explicitly from origin
          git fetch origin ${{ github.event.pull_request.base.ref }}
          # Run review against origin/base_branch
          python review_repo.py . --branch origin/${{ github.event.pull_request.base.ref }}
