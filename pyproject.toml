[project]
name = "mandate"
version = "0.1.0"
description = "MANDATE — Autonomous AI. Governed by Authority. Cryptographic governance layer for autonomous multi-agent systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "armoriq-sdk>=0.6.0",
    "cryptography>=41.0.0",
    "ruff>=0.4.0",
    "semgrep>=1.50.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
